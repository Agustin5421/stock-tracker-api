services:
  batch:
    image: python:3.12-slim
    working_dir: /app
    restart: "no"
    volumes:
      - ./:/app
    environment:
      DB_HOST: stock-tracker-db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      OVERRIDE_TICKERS: ${OVERRIDE_TICKERS:-}
    networks:
      - stock-tracker-api_default
    command: sh -c "pip install -r requirements.txt && python3 update_prices.py"

  seed:
    image: python:3.12-slim
    working_dir: /app
    restart: "no"
    volumes:
      - ./:/app
    environment:
      DB_HOST: stock-tracker-db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - stock-tracker-api_default
    command: sh -c "pip install -r requirements.txt && python3 seed_top_companies.py"

networks:
  stock-tracker-api_default:
    external: true
