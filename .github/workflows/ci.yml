name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  web-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  api-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew ktlintCheck

  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test

  price-update-batch:
    runs-on: ubuntu-latest
    needs: api-tests
    continue-on-error: true
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: kiwii_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r batch/requirements.txt
      - name: Run Flyway migrations against test MySQL
        run: |
          docker run --rm --network host \
            -v "$PWD/api/src/main/resources/db/migration:/flyway/sql" \
            flyway/flyway:10 \
            -url="jdbc:mysql://localhost:3306/kiwii_test?allowPublicKeyRetrieval=true&useSSL=false" \
            -user=root -password=test migrate
      - name: Run batch against real Yahoo Finance (smoke)
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: kiwii_test
          DB_USER: root
          DB_PASSWORD: test
        run: |
          python3 -c "
          import os; os.environ.setdefault('OVERRIDE_TICKERS','AAPL')
          import batch.update_prices as b; b.run(['AAPL'])
          "

  e2e-cypress:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: stocktracker
          MYSQL_USER: stocktracker
          MYSQL_PASSWORD: stocktracker
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/stocktracker?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: stocktracker
      SPRING_DATASOURCE_PASSWORD: stocktracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install cypress deps
        working-directory: e2e/web
        run: npm ci

      - name: Start API
        working-directory: api
        env:
          SPRING_PROFILES_ACTIVE: e2e
        run: nohup ./gradlew bootRun > api.log 2>&1 &

      - name: Start web
        working-directory: web
        run: nohup pnpm start > web.log 2>&1 &

      - name: Wait for API and web
        run: |
          npx --yes wait-on http://localhost:8080/actuator/health http://localhost:3000 --timeout 180000

      - name: Run cypress
        working-directory: e2e/web
        run: npx cypress run
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

      - name: Upload cypress artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            e2e/web/cypress/screenshots
            e2e/web/cypress/videos
            api/api.log
            web/web.log
